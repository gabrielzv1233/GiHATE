name: Build

on:
  workflow_dispatch:
    inputs:
      clean_build:
        description: 'Clean build (ignore saved NuGet/runtime package cache)'
        required: true
        default: false
        type: boolean

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    env:
      DOTNET_VERSION: '8.0.424'
      BUILD_RID: win-x64
      NUGET_CACHE_VERSION: v1
      NUGET_PACKAGES: ${{ github.workspace }}\.nuget\packages
      DOTNET_CLI_TELEMETRY_OPTOUT: '1'
      DOTNET_SKIP_FIRST_TIME_EXPERIENCE: '1'
      NUGET_XMLDOC_MODE: skip

    steps:
      - uses: actions/checkout@v7

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore NuGet/runtime package cache
        if: ${{ !inputs.clean_build }}
        uses: actions/cache@v5
        with:
          path: ${{ env.NUGET_PACKAGES }}
          key: nuget-${{ runner.os }}-dotnet-${{ env.DOTNET_VERSION }}-${{ env.BUILD_RID }}-${{ env.NUGET_CACHE_VERSION }}

      - name: Clean package directory
        if: ${{ inputs.clean_build }}
        shell: pwsh
        run: |
          if (Test-Path $env:NUGET_PACKAGES) {
            Remove-Item $env:NUGET_PACKAGES -Recurse -Force
          }
          Write-Host 'Clean build requested: saved NuGet/runtime package cache will not be restored or updated.'

      - name: Publish single-file executable
        shell: pwsh
        run: >-
          dotnet publish .\src\GiMateButtonRemapper\GiMateButtonRemapper.csproj
          -c Release
          -r $env:BUILD_RID
          --self-contained true
          -p:PublishSingleFile=true
          -o .\publish

      - name: Upload GiHATE.exe
        uses: actions/upload-artifact@v7
        with:
          name: GiHATE-win-x64
          path: publish/GiHATE.exe
          if-no-files-found: error
