name: Build

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Publish single-file executable
        shell: pwsh
        run: >-
          dotnet publish .\src\GiMateButtonRemapper\GiMateButtonRemapper.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -o .\publish

      - name: Upload GiHATE.exe
        uses: actions/upload-artifact@v4
        with:
          name: GiHATE-win-x64
          path: publish/GiHATE.exe
          if-no-files-found: error
